<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect the Dogs</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* The canvas where the game is drawn */
        #gameCanvas {
            background-color: white;
            border: 4px solid #8b4513; /* Brown border */
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <h1>Connect the Dogs! 🐾</h1>
    <p>Click and drag from dog 1, to dog 2, to dog 3...</p>

    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // The coordinates for our small dogs (forming a basic dog face shape)
        const dogs = [
            { x: 150, y: 150 }, // 1. Left Ear Top
            { x: 200, y: 200 }, // 2. Left Ear Base
            { x: 300, y: 200 }, // 3. Right Ear Base
            { x: 350, y: 150 }, // 4. Right Ear Top
            { x: 400, y: 280 }, // 5. Right Cheek
            { x: 300, y: 380 }, // 6. Chin Right
            { x: 200, y: 380 }, // 7. Chin Left
            { x: 100, y: 280 }  // 8. Left Cheek
        ];

        let currentDogIndex = 0; // Starts at Dog 1
        let isDrawing = false;
        let mouseX = 0;
        let mouseY = 0;
        let gameWon = false;

        // Load the Big Dog image (the reveal)
        const bigDogImg = new Image();
        // Using a cute placeholder dog image from Unsplash
        bigDogImg.src = 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80';

        // Helper function to calculate distance between two points
        function getDistance(x1, y1, x2, y2) {
            return Math.hypot(x2 - x1, y2 - y1);
        }

        // Draw the game frame
        function draw() {
            // Clear the canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw the Big Dog if they won!
            if (gameWon) {
                ctx.globalAlpha = 0.8; // Make it slightly transparent so we can see lines
                // Draw the image centered
                ctx.drawImage(bigDogImg, 50, 50, 400, 400);
                ctx.globalAlpha = 1.0; // Reset transparency

                ctx.fillStyle = '#228B22';
                ctx.font = 'bold 30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Good Job! You found the Big Dog!', canvas.width / 2, 40);
            }

            // 2. Draw the completed, solid lines
            if (currentDogIndex > 0) {
                ctx.beginPath();
                ctx.moveTo(dogs[0].x, dogs[0].y);
                for (let i = 1; i <= currentDogIndex; i++) {
                    // If game won, wrap back to 0 to close the shape
                    let idx = (i === dogs.length) ? 0 : i; 
                    ctx.lineTo(dogs[idx].x, dogs[idx].y);
                }
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            // 3. Draw the temporary dashed line following the mouse
            if (isDrawing && !gameWon) {
                ctx.beginPath();
                ctx.moveTo(dogs[currentDogIndex].x, dogs[currentDogIndex].y);
                ctx.lineTo(mouseX, mouseY);
                ctx.strokeStyle = '#999';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]); // Dashed line effect
                ctx.stroke();
                ctx.setLineDash([]); // Reset to solid for other lines
            }

            // 4. Draw the small dogs (nodes)
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            dogs.forEach((dog, index) => {
                // Draw the dog emoji
                ctx.font = '24px Arial';
                ctx.fillText('🐶', dog.x, dog.y - 12);
                
                // Draw the number below it
                ctx.font = 'bold 14px Arial';
                ctx.fillStyle = '#000';
                ctx.fillText(index + 1, dog.x, dog.y + 15);
            });
        }

        // --- Event Listeners for Mouse --- //

        canvas.addEventListener('mousedown', (e) => {
            if (gameWon) return;

            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;

            // Check if user clicked near the current dog they are supposed to start from
            if (getDistance(mouseX, mouseY, dogs[currentDogIndex].x, dogs[currentDogIndex].y) < 30) {
                isDrawing = true;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;

            draw(); // Re-draw frame as mouse moves
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;

            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;

            // Determine the next dog target (if at the end, the target is dog 1 [index 0])
            let targetIndex = (currentDogIndex + 1) % dogs.length;

            // Check if user let go of the mouse near the correct NEXT dog
            if (getDistance(mouseX, mouseY, dogs[targetIndex].x, dogs[targetIndex].y) < 30) {
                currentDogIndex++;
                
                // If they successfully connected back to the first dog
                if (currentDogIndex === dogs.length) {
                    gameWon = true;
                }
            }
            
            draw(); // Update the canvas
        });

        // Initial draw call to display the dogs when the page loads
        draw();

    </script>
</body>
</html>
